services:
  - type: web
    name: loaniq-backend
    runtime: python
    buildCommand: pip install torch==2.2.0+cpu --index-url https://download.pytorch.org/whl/cpu && pip install torch_geometric && pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        value: microloan_secret_key_2024
      - key: MAIL_USERNAME
        value: aakashkumarjha241@gmail.com
      - key: MAIL_PASSWORD
        value: yaebappncugoeljg
      - key: MAIL_FROM
        value: aakashkumarjha241@gmail.com
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"

  - type: web
    name: loaniq-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html